x-worker: &worker
  build: ./worker
  restart: unless-stopped
  depends_on:
    - controller
  networks:
    - dfs-network

services:
  controller:
    build: ./controller
    container_name: controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DB_PATH: /data/metadata/metadata.db
      REPLICATION_FACTOR: "2"
      HEARTBEAT_TIMEOUT_SEC: "10"
    volumes:
      - controller-data:/data/metadata
    networks:
      - dfs-network

  worker1:
    <<: *worker
    container_name: worker1
    ports:
      - "8001:8001"
    environment:
      WORKER_ID: worker1
      PORT: "8001"
      CONTROLLER_URL: http://controller:8000
    volumes:
      - worker1-data:/data/chunks

  worker2:
    <<: *worker
    container_name: worker2
    ports:
      - "8002:8001"
    environment:
      WORKER_ID: worker2
      PORT: "8001"
      CONTROLLER_URL: http://controller:8000
    volumes:
      - worker2-data:/data/chunks

  worker3:
    <<: *worker
    container_name: worker3
    ports:
      - "8003:8001"
    environment:
      WORKER_ID: worker3
      PORT: "8001"
      CONTROLLER_URL: http://controller:8000
    volumes:
      - worker3-data:/data/chunks

  worker4:
    <<: *worker
    container_name: worker4
    ports:
      - "8004:8001"
    environment:
      WORKER_ID: worker4
      PORT: "8001"
      CONTROLLER_URL: http://controller:8000
    volumes:
      - worker4-data:/data/chunks

volumes:
  controller-data:
  worker1-data:
  worker2-data:
  worker3-data:
  worker4-data:

networks:
  dfs-network:
    driver: bridge

